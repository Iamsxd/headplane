server:
  host: 127.0.0.1
  port: 3000
  base_url: https://140.143.127.180
  cookie_secret_path: /etc/headplane/cookie-secret
  cookie_secure: true
  cookie_max_age: 28800
  data_path: /var/lib/headplane
  proxy_auth:
    enabled: true
    user_header: Remote-User
    email_header: Remote-Email
    name_header: Remote-Name
    picture_header: Remote-Picture
    allowed_cidrs:
      - 127.0.0.1/32
headscale:
  url: http://127.0.0.1:8081
  public_url: https://140.143.127.180
  config_path: /etc/headscale/config.yaml
  api_key_path: /etc/headplane/headscale-api-key
integration:
  agent:
    enabled: false
  docker:
    enabled: false
  kubernetes:
    enabled: false
    pod_name: headscale
  proc:
    enabled: false
