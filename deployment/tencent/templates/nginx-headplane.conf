location = /admin {
    return 308 /admin/;
}

location ^~ /admin/ {
    auth_basic "Headplane administration";
    auth_basic_user_file /etc/headplane/admin.htpasswd;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Remote-User $remote_user;
    proxy_set_header Remote-Email "admin@headplane.local";
    proxy_set_header Remote-Name "Administrator";
    proxy_set_header Remote-Picture "";
    proxy_set_header Authorization "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $hs_connection_upgrade;
    proxy_read_timeout 60s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
}
