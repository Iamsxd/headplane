location = /auth { return 308 /auth/; }

location = /auth/api/get-application {
    if ($arg_id !~* "^admin(?:/|%2f)headplane$") { return 403; }
    include /etc/nginx/snippets/casdoor-upstream.conf;
}
location = /auth/api/get-organization {
    if ($arg_id !~* "^admin(?:/|%2f)headplane$") { return 403; }
    include /etc/nginx/snippets/casdoor-upstream.conf;
}
location = /auth/api/get-default-application {
    if ($arg_id !~* "^admin(?:/|%2f)headplane$") { return 403; }
    include /etc/nginx/snippets/casdoor-upstream.conf;
}

# Only protocol and self-service endpoints are public. Provider administration stays local.
location ~ ^/auth/api/(?:health|login(?:/oauth/access_token)?|logout|userinfo|get-app-login|get-account|get-user|get-user-application|update-user|set-password|check-user-password|get-captcha|get-email-and-phone|mfa/setup/(?:initiate|verify|enable)|delete-mfa|set-preferred-mfa)$ {
    include /etc/nginx/snippets/casdoor-upstream.conf;
}
location /auth/api/ { return 403; }
location ~ ^/auth/(?:users|applications|organizations|providers|certs|tokens|sessions|roles|permissions|groups)(?:/|$) { return 403; }
location /auth/ {
    include /etc/nginx/snippets/casdoor-upstream.conf;
}
